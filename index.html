<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Полёт ракеты</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    user-select: none;
}

body {
    background: #8ed8ff;
}

/* =====================================================
   ИГРОВОЕ ПОЛЕ
===================================================== */

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #63c9ff 0%,
            #8ddcff 55%,
            #d9f4ff 100%
        );

    transition: background 2s ease;
}

/* =====================================================
   ДВИЖУЩИЙСЯ ФОН
===================================================== */

#skyLayer {
    position: absolute;
    inset: -50% 0 0 0;
    height: 200%;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.25) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 75% 40%,
            rgba(255,255,255,.20) 0 2px,
            transparent 3px
        );

    background-size: 180px 220px;
}

#game.flying #skyLayer {
    animation: skyMove 7s linear infinite;
}

@keyframes skyMove {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(230px);
    }
}

/* =====================================================
   АЭРОДРОМ
===================================================== */

#ground {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 25%;

    background:
        linear-gradient(
            to bottom,
            #71b75f 0 28%,
            #649f53 28% 35%,
            #8b8c8d 35% 100%
        );

    transition:
        transform 3s ease-in,
        opacity 2.5s ease;
}

#game.flying #ground {
    transform: translateY(130%);
    opacity: 0;
}

#runway {
    position: absolute;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 30%;
    height: 70%;

    background: #606569;

    clip-path: polygon(
        40% 0,
        60% 0,
        100% 100%,
        0 100%
    );
}

#runway::after {
    content: "";

    position: absolute;

    left: 49%;
    top: 4%;

    width: 3%;
    height: 100%;

    background:
        repeating-linear-gradient(
            to bottom,
            white 0 25px,
            transparent 25px 55px
        );
}

/* =====================================================
   РАКЕТА
===================================================== */

#rocket {
    position: absolute;

    left: 50%;
    bottom: 10%;

    width: 105px;
    height: 190px;

    transform: translateX(-50%);

    z-index: 30;

    cursor: pointer;

    transition:
        left 1.2s cubic-bezier(.22,.8,.25,1),
        bottom 2.6s cubic-bezier(.22,.8,.25,1),
        transform .5s ease;
}

.rocket-body {
    position: absolute;

    left: 22px;
    top: 12px;

    width: 61px;
    height: 125px;

    background: linear-gradient(
        90deg,
        #efefef,
        white 45%,
        #d8d8d8
    );

    border-radius: 50% 50% 23% 23%;

    box-shadow:
        inset -5px 0 8px rgba(0,0,0,.08),
        0 5px 12px rgba(0,0,0,.15);
}

.rocket-body::before {
    content: "";

    position: absolute;

    left: 0;
    top: -31px;

    width: 61px;
    height: 55px;

    background: #ed5257;

    clip-path: polygon(
        50% 0,
        100% 72%,
        100% 100%,
        0 100%,
        0 72%
    );

    border-radius: 50% 50% 0 0;
}

.window {
    position: absolute;

    left: 14px;
    top: 31px;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    background: #65cdf4;

    border: 5px solid #415f72;

    box-shadow:
        inset 3px 3px 5px rgba(255,255,255,.5);
}

.fin-left,
.fin-right {
    position: absolute;

    bottom: 34px;

    width: 33px;
    height: 55px;

    background: #ed5257;
}

.fin-left {
    left: 8px;

    clip-path: polygon(
        100% 0,
        100% 100%,
        0 100%,
        35% 25%
    );
}

.fin-right {
    right: 8px;

    clip-path: polygon(
        0 0,
        0 100%,
        100% 100%,
        65% 25%
    );
}

#fire {
    position: absolute;

    left: 38px;
    top: 132px;

    width: 29px;
    height: 68px;

    opacity: 0;

    transform-origin: top center;

    background:
        linear-gradient(
            to bottom,
            #fff167 0%,
            #ffa12c 40%,
            #ff5032 70%,
            transparent 100%
        );

    clip-path: polygon(
        50% 100%,
        0 0,
        100% 0
    );
}

#game.flying #fire {
    opacity: 1;
    animation: flame .14s ease-in-out infinite alternate;
}

@keyframes flame {
    from {
        transform: scaleY(.78) scaleX(.85);
    }

    to {
        transform: scaleY(1.15) scaleX(1.05);
    }
}

/* лёгкое покачивание */

#game.flying #rocket {
    animation: rocketFloat .75s ease-in-out infinite alternate;
}

@keyframes rocketFloat {
    from {
        margin-top: -3px;
    }

    to {
        margin-top: 3px;
    }
}

/* =====================================================
   СТАРТОВАЯ ПОДСКАЗКА
===================================================== */

#startText {
    position: absolute;

    top: 8%;
    left: 50%;

    transform: translateX(-50%);

    padding: 14px 28px;

    border-radius: 30px;

    background: rgba(255,255,255,.88);

    color: #294d68;

    font-size: clamp(18px, 2.3vw, 30px);
    font-weight: 700;

    z-index: 50;

    box-shadow: 0 5px 15px rgba(0,0,0,.1);

    transition:
        opacity .4s ease,
        transform .4s ease;
}

#startText.hidden {
    opacity: 0;

    transform:
        translateX(-50%)
        translateY(-20px);

    pointer-events: none;
}

/* =====================================================
   ОБЛАКА
===================================================== */

.cloud-wrapper {
    position: absolute;

    top: -180px;

    width: 210px;
    height: 125px;

    z-index: 20;

    animation: cloudDown 10s linear forwards;
}

.cloud-wrapper.left {
    left: 7%;
}

.cloud-wrapper.center {
    left: 50%;
    margin-left: -105px;
}

.cloud-wrapper.right {
    right: 7%;
}

.cloud {
    position: relative;

    width: 210px;
    height: 125px;

    cursor: pointer;

    filter:
        drop-shadow(
            0 8px 8px rgba(40,110,150,.12)
        );
}

.cloud-shape {
    position: absolute;

    left: 10px;
    bottom: 8px;

    width: 190px;
    height: 68px;

    background: white;

    border-radius: 60px;
}

.cloud-shape::before {
    content: "";

    position: absolute;

    width: 86px;
    height: 86px;

    left: 29px;
    top: -42px;

    background: white;

    border-radius: 50%;
}

.cloud-shape::after {
    content: "";

    position: absolute;

    width: 104px;
    height: 104px;

    right: 18px;
    top: -57px;

    background: white;

    border-radius: 50%;
}

/* временная карточка */

.word-card {
    position: absolute;

    left: 50%;
    top: 44%;

    transform: translate(-50%, -50%);

    width: 68px;
    height: 68px;

    border-radius: 50%;

    background: #ffd64d;

    border: 5px solid white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 38px;
    font-weight: 900;

    color: #475a78;

    z-index: 5;

    box-shadow:
        0 5px 12px rgba(0,0,0,.15);

    transition: transform .2s ease;
}

.cloud:hover .word-card {
    transform:
        translate(-50%, -50%)
        scale(1.08);
}

@keyframes cloudDown {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(calc(100vh + 250px));
    }
}

.cloud-wrapper.correct {
    pointer-events: none;
    animation: cloudDisappear .6s ease forwards;
}

@keyframes cloudDisappear {
    to {
        opacity: 0;
        transform: scale(1.12);
    }
}

/* =====================================================
   КОСМОС
===================================================== */

#space {
    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    opacity: 0;

    transition: opacity 2.3s ease;

    background:
        radial-gradient(circle at 20% 16%, white 0 2px, transparent 3px),
        radial-gradient(circle at 82% 23%, white 0 2px, transparent 3px),
        radial-gradient(circle at 42% 35%, white 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 67% 51%, white 0 2px, transparent 3px),
        radial-gradient(circle at 13% 67%, white 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 89% 74%, white 0 2px, transparent 3px),
        radial-gradient(circle at 37% 82%, white 0 1.5px, transparent 2.5px),
        linear-gradient(
            to bottom,
            #142354,
            #080d2d 52%,
            #030618
        );

    background-size:
        250px 250px,
        310px 310px,
        180px 180px,
        290px 290px,
        230px 230px,
        350px 350px,
        210px 210px,
        auto;
}

#game.space-mode #space {
    opacity: 1;
}

/* =====================================================
   ФИНАЛ
===================================================== */

#finishText {
    position: absolute;

    left: 50%;
    top: 15%;

    transform:
        translate(-50%, -20px)
        scale(.9);

    z-index: 60;

    opacity: 0;

    color: white;

    text-align: center;

    font-size: clamp(28px, 4vw, 54px);
    font-weight: 900;

    text-shadow:
        0 4px 12px rgba(0,0,0,.4);

    transition: all .8s ease;
}

#finishText.show {
    opacity: 1;

    transform:
        translate(-50%, 0)
        scale(1);
}

/* =====================================================
   МОБИЛЬНАЯ АДАПТАЦИЯ
===================================================== */

@media (max-width: 700px) {

    #rocket {
        transform:
            translateX(-50%)
            scale(.86);
    }

    .cloud-wrapper {
        width: 170px;
        height: 110px;
    }

    .cloud {
        transform: scale(.82);
        transform-origin: top left;
    }

    .cloud-wrapper.center {
        margin-left: -85px;
    }
}

</style>
</head>

<body>

<div id="game">

    <div id="space"></div>

    <div id="skyLayer"></div>

    <div id="startText">
        🚀 Нажми на ракету!
    </div>

    <div id="ground">
        <div id="runway"></div>
    </div>

    <div id="rocket">

        <div class="fin-left"></div>
        <div class="fin-right"></div>

        <div class="rocket-body">
            <div class="window"></div>
        </div>

        <div id="fire"></div>

    </div>

    <div id="finishText">
        Мы в космосе! 🚀✨
    </div>

</div>

<script>

/* =====================================================
   РАУНДЫ
===================================================== */

const rounds = [

    {
        side: "left",
        text: "Р"
    },

    {
        side: "center",
        text: "Р"
    },

    {
        side: "right",
        text: "Р"
    },

    {
        side: "right",
        text: "Р"
    },

    {
        side: "left",
        text: "Р"
    },

    {
        side: "center",
        text: "Р"
    }

];

/* скорость облаков */

const CLOUD_DURATION = 10;

/* пауза между облаками */

const NEXT_ROUND_DELAY = 1200;


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById("game");

const rocket =
    document.getElementById("rocket");

const startText =
    document.getElementById("startText");

const finishText =
    document.getElementById("finishText");


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let gameStarted = false;

let currentRound = 0;

let currentCloud = null;

let canClickCloud = false;

let finishing = false;

let currentRocketSide = "center";


/* =====================================================
   СТАРТ
===================================================== */

rocket.addEventListener(
    "click",
    startGame
);

function startGame() {

    if (gameStarted) return;

    gameStarted = true;

    game.classList.add("flying");

    startText.classList.add("hidden");

    rocket.style.bottom = "29%";

    setTimeout(
        () => {

            rocket.style.bottom = "25%";

            createRound();

        },
        2600
    );
}


/* =====================================================
   СОЗДАНИЕ ОБЛАКА
===================================================== */

function createRound() {

    if (currentRound >= rounds.length) {

        startSpaceSequence();

        return;
    }

    canClickCloud = true;

    const data =
        rounds[currentRound];

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `cloud-wrapper ${data.side}`;

    wrapper.style.animationDuration =
        CLOUD_DURATION + "s";

    wrapper.innerHTML = `

        <div class="cloud">

            <div class="cloud-shape"></div>

            <div class="word-card">
                ${data.text}
            </div>

        </div>

    `;

    game.appendChild(wrapper);

    currentCloud = wrapper;

    wrapper.addEventListener(
        "click",
        () => {

            chooseCloud(
                wrapper,
                data.side
            );

        }
    );

    wrapper.addEventListener(
        "animationend",
        () => {

            if (
                wrapper === currentCloud &&
                !wrapper.classList.contains("correct")
            ) {

                wrapper.remove();

                currentCloud = null;

                setTimeout(
                    createRound,
                    300
                );
            }
        }
    );
}


/* =====================================================
   НАЖАТИЕ НА ОБЛАКО
===================================================== */

function chooseCloud(
    cloud,
    side
) {

    if (
        !canClickCloud ||
        finishing
    ) return;

    canClickCloud = false;

    cloud.classList.add("correct");

    moveRocketTo(side);

    setTimeout(
        () => {

            cloud.remove();

            currentCloud = null;

        },
        600
    );

    currentRound++;

    setTimeout(
        createRound,
        NEXT_ROUND_DELAY
    );
}


/* =====================================================
   СМЕНА ТРАЕКТОРИИ
===================================================== */

function moveRocketTo(side) {

    currentRocketSide = side;

    if (side === "left") {

        rocket.style.left = "25%";

        rocket.style.transform =
            "translateX(-50%) rotate(-7deg)";
    }

    if (side === "center") {

        rocket.style.left = "50%";

        rocket.style.transform =
            "translateX(-50%) rotate(0deg)";
    }

    if (side === "right") {

        rocket.style.left = "75%";

        rocket.style.transform =
            "translateX(-50%) rotate(7deg)";
    }

    /*
       Через короткое время ракета
       выпрямляется, но остаётся
       на новой траектории.
    */

    setTimeout(
        () => {

            rocket.style.transform =
                "translateX(-50%) rotate(0deg)";

        },
        900
    );
}


/* =====================================================
   ПЕРЕХОД В КОСМОС
===================================================== */

function startSpaceSequence() {

    if (finishing) return;

    finishing = true;

    game.classList.add(
        "space-mode"
    );

    /*
       Перед входом в космос
       ракета плавно идёт в центр.
    */

    setTimeout(
        () => {

            rocket.style.left = "50%";

            rocket.style.transform =
                "translateX(-50%) rotate(0deg)";

            rocket.style.bottom =
                "48%";

        },
        700
    );

    setTimeout(
        () => {

            finishText.classList.add(
                "show"
            );

        },
        2500
    );

    setTimeout(
        () => {

            rocket.style.transition =
                "bottom 3.2s ease-in, " +
                "left 1.2s ease, " +
                "transform .6s ease";

            rocket.style.bottom =
                "115%";

        },
        4000
    );
}

</script>

</body>
</html>
