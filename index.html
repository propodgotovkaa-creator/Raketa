<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Полёт ракеты</title>


<!-- =====================================================
     ШРИФТ
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Neucha&display=swap"
    rel="stylesheet"
>


<style>

/* =====================================================
   ОСНОВА
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    -webkit-tap-highlight-color:
        transparent;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        "Neucha",
        cursive;

    user-select:none;
    -webkit-user-select:none;

    background:#74d2ff;
}


button{

    font-family:
        "Neucha",
        cursive;

    -webkit-tap-highlight-color:
        transparent;

    outline:none;
}


button:focus,
button:active{

    outline:none;
}


#game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:#75d3ff;
}



/* =====================================================
   НЕБО
===================================================== */

#sky{

    position:absolute;

    inset:0;

    z-index:0;

    background:

        linear-gradient(
            to bottom,
            #43b7fa 0%,
            #62c7ff 38%,
            #85d8ff 68%,
            #b9edff 100%
        );
}



/* =====================================================
   ПРОМЕЖУТОЧНОЕ НЕБО
===================================================== */

#transitionSky{

    position:absolute;

    left:0;
    top:-5%;

    width:100%;
    height:125%;

    z-index:2;

    pointer-events:none;

    opacity:0;

    background:

        radial-gradient(
            ellipse at 12% 63%,
            rgba(255,255,255,.88) 0%,
            rgba(255,255,255,.62) 11%,
            rgba(255,255,255,.22) 23%,
            transparent 35%
        ),

        radial-gradient(
            ellipse at 31% 55%,
            rgba(255,255,255,.75) 0%,
            rgba(255,255,255,.38) 14%,
            transparent 31%
        ),

        radial-gradient(
            ellipse at 62% 60%,
            rgba(255,255,255,.70) 0%,
            rgba(255,255,255,.34) 15%,
            transparent 32%
        ),

        radial-gradient(
            ellipse at 86% 53%,
            rgba(255,255,255,.86) 0%,
            rgba(255,255,255,.48) 14%,
            transparent 34%
        ),

        linear-gradient(
            to bottom,
            rgba(88,190,247,.25) 0%,
            rgba(102,201,250,.38) 35%,
            rgba(133,218,255,.68) 70%,
            rgba(181,236,255,.88) 100%
        );

    transition:
        opacity 1.6s ease;
}


#game.flying #transitionSky{

    opacity:1;

    animation:
        transitionMove
        8s
        linear
        forwards;
}


@keyframes transitionMove{

    from{

        transform:
            translateY(-4%);
    }

    to{

        transform:
            translateY(36%);
    }
}



/* =====================================================
   КОСМОДРОМ
===================================================== */

#airport{

    position:absolute;

    inset:0;

    z-index:4;

    background-image:
        url("fon.png");

    background-size:
        cover;

    background-position:
        center center;

    background-repeat:
        no-repeat;

    transform:
        translateY(0)
        scale(1);

    opacity:1;

    transition:

        transform
        5.2s
        cubic-bezier(.20,.64,.23,1),

        opacity
        4.7s
        ease;
}


#airportFade{

    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:38%;

    z-index:5;

    pointer-events:none;

    opacity:0;

    background:

        linear-gradient(
            to top,
            rgba(165,231,255,.96) 0%,
            rgba(150,226,255,.82) 15%,
            rgba(136,219,255,.60) 32%,
            rgba(121,211,255,.37) 51%,
            rgba(108,203,255,.18) 70%,
            rgba(95,197,255,.06) 85%,
            transparent 100%
        );

    transition:
        opacity 1.5s ease;
}


#game.flying #airport{

    transform:
        translateY(112%)
        scale(1.07);

    opacity:0;
}


#game.flying #airportFade{

    opacity:1;
}



/* =====================================================
   ДВИЖЕНИЕ НЕБА
===================================================== */

#skyTexture{

    position:absolute;

    left:0;
    top:-40%;

    width:100%;
    height:180%;

    z-index:3;

    pointer-events:none;

    opacity:0;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.18) 0 2px,
            transparent 3px
        ),

        radial-gradient(
            circle at 80% 35%,
            rgba(255,255,255,.15) 0 2px,
            transparent 3px
        );

    background-size:
        190px 230px;

    transition:
        opacity 1.5s ease;
}


#game.flying #skyTexture{

    opacity:1;

    animation:
        skyMove
        6s
        linear
        infinite;
}


@keyframes skyMove{

    from{

        transform:
            translateY(-120px);
    }

    to{

        transform:
            translateY(250px);
    }
}



/* =====================================================
   МЕНЮ
===================================================== */

#menu{

    position:absolute;

    inset:0;

    z-index:100;

    transition:
        opacity .6s ease;
}


#menu.hidden{

    opacity:0;

    pointer-events:none;
}



/* =====================================================
   ЗАГОЛОВОК МЕНЮ
===================================================== */

#menuTitle{

    position:absolute;

    top:7%;

    left:50%;

    transform:
        translateX(-50%);

    padding:
        14px 30px;

    border-radius:
        35px;

    background:
        rgba(255,255,255,.91);

    backdrop-filter:
        blur(8px);

    -webkit-backdrop-filter:
        blur(8px);

    color:
        #244e6c;

    font-size:

        clamp(
            26px,
            3vw,
            42px
        );

    font-weight:
        400;

    white-space:
        nowrap;

    box-shadow:

        0 7px 22px
        rgba(0,0,0,.14);
}



/* =====================================================
   КНОПКИ МЕНЮ
===================================================== */

.modeButton{

    position:absolute;

    min-width:

        clamp(
            270px,
            29vw,
            430px
        );

    padding:
        23px 28px;

    border:

        4px solid
        rgba(255,255,255,.92);

    border-radius:
        28px;

    background:
        rgba(255,255,255,.84);

    backdrop-filter:
        blur(9px);

    -webkit-backdrop-filter:
        blur(9px);

    color:
        #24587b;

    font-size:

        clamp(
            25px,
            2.7vw,
            39px
        );

    font-weight:
        400;

    text-align:
        center;

    cursor:
        pointer;

    box-shadow:

        0 9px 25px
        rgba(30,80,110,.22);

    transition:

        transform .25s ease,
        background .25s ease;

    outline:
        none;
}


.modeButton:hover{

    transform:
        scale(1.04);

    background:
        rgba(255,255,255,.96);
}


.modeButton:active{

    transform:
        scale(.97);

    outline:
        none;
}


#startMode{

    left:8%;

    top:28%;
}


#middleMode{

    right:8%;

    top:47%;
}


#endMode{

    left:8%;

    top:66%;
}



/* =====================================================
   ЗАГРУЗКА

   ЭЛЕМЕНТ ОСТАЁТСЯ ДЛЯ JS,
   НО НА ЭКРАНЕ НЕ ПОКАЗЫВАЕТСЯ
===================================================== */

#loading{

    display:
        none !important;
}



/* =====================================================
   РАКЕТА
===================================================== */

#rocket{

    position:absolute;

    left:50%;

    bottom:27.5%;

    transform:
        translateX(-50%);

    width:

        clamp(
            155px,
            14vw,
            225px
        );

    z-index:30;

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    outline:none;

    transition:

        opacity .55s ease,

        left
        1.15s
        cubic-bezier(.22,.75,.3,1),

        bottom
        2.8s
        cubic-bezier(.22,.75,.3,1),

        transform
        .55s
        ease;
}


#rocket.ready{

    opacity:1;

    pointer-events:auto;
}


#rocketImage{

    display:block;

    position:relative;

    width:100%;

    height:auto;

    z-index:3;

    pointer-events:none;
}



/* =====================================================
   ОГОНЬ
===================================================== */

#fire{

    position:absolute;

    left:50%;

    top:83%;

    transform:
        translateX(-50%);

    width:57%;

    z-index:1;

    opacity:0;

    pointer-events:none;
}


#fire img{

    display:block;

    width:100%;

    height:auto;
}


#game.engine-on #fire{

    opacity:1;
}



/* =====================================================
   ПОКАЧИВАНИЕ РАКЕТЫ
===================================================== */

#game.flying #rocket{

    animation:

        rocketFloat
        .72s
        ease-in-out
        infinite
        alternate;
}


@keyframes rocketFloat{

    from{

        margin-top:-3px;
    }

    to{

        margin-top:3px;
    }
}



/* =====================================================
   НАДПИСЬ ПЕРЕД СТАРТОМ
===================================================== */

#startText{

    position:absolute;

    left:50%;

    top:7%;

    transform:
        translateX(-50%);

    z-index:50;

    padding:
        15px 30px;

    border-radius:
        40px;

    background:
        rgba(255,255,255,.90);

    backdrop-filter:
        blur(7px);

    -webkit-backdrop-filter:
        blur(7px);

    color:
        #244e6c;

    font-size:

        clamp(
            24px,
            2.7vw,
            39px
        );

    font-weight:
        400;

    box-shadow:

        0 6px 18px
        rgba(0,0,0,.13);

    opacity:0;

    pointer-events:none;

    transition:

        opacity .5s ease,
        transform .5s ease;
}


#startText.visible{

    opacity:1;
}


#startText.hidden{

    opacity:0;

    transform:

        translateX(-50%)

        translateY(-25px);
}



/* =====================================================
   ОБЛАКА
===================================================== */

.cloud-wrapper{

    position:absolute;

    top:-230px;


    /*
       ОБЛАКА СТАЛИ МЕНЬШЕ
    */

    width:

        clamp(
            205px,
            20vw,
            320px
        );


    z-index:20;

    cursor:pointer;


    animation:

        cloudDown
        11s
        linear
        forwards;


    /*
       НИКАКИХ ТЕНЕЙ
       И ПОДСВЕТОК
    */

    filter:
        none !important;

    box-shadow:
        none !important;

    text-shadow:
        none !important;

    outline:
        none !important;

    border:
        none !important;

    background:
        transparent !important;


    -webkit-tap-highlight-color:
        rgba(0,0,0,0) !important;

    -webkit-touch-callout:
        none;

    -webkit-user-select:
        none;

    user-select:
        none;

    touch-action:
        manipulation;
}


.cloud-wrapper img{

    display:block;

    width:100%;

    height:auto;

    pointer-events:none;

    user-select:none;

    -webkit-user-select:none;

    -webkit-user-drag:none;

    filter:
        none !important;

    box-shadow:
        none !important;

    outline:
        none !important;

    border:
        none !important;
}


.cloud-wrapper.left{

    left:6%;
}


.cloud-wrapper.center{

    left:50%;

    transform:
        translateX(-50%);
}


.cloud-wrapper.right{

    right:6%;
}


.cloud-wrapper:hover,
.cloud-wrapper:focus,
.cloud-wrapper:focus-visible,
.cloud-wrapper:active{

    outline:
        none !important;

    border:
        none !important;

    box-shadow:
        none !important;

    filter:
        none !important;

    background:
        transparent !important;
}



/* =====================================================
   ПАДЕНИЕ ОБЛАКА
===================================================== */

@keyframes cloudDown{

    from{

        top:-230px;
    }

    to{

        top:110%;
    }
}



/* =====================================================
   НАЖАЛИ НА ОБЛАКО
===================================================== */

.cloud-wrapper.correct{

    pointer-events:none;

    filter:
        none !important;

    box-shadow:
        none !important;

    outline:
        none !important;

    animation:

        cloudOut
        .12s
        linear
        forwards;
}


@keyframes cloudOut{

    from{

        opacity:1;
    }

    to{

        opacity:0;
    }
}



/* =====================================================
   ПЕРЕХОД В КОСМОС
===================================================== */

#spaceTransition{

    position:absolute;

    inset:0;

    z-index:7;

    pointer-events:none;

    opacity:0;

    background:

        linear-gradient(
            to bottom,
            rgba(31,91,151,0) 0%,
            rgba(24,61,118,.15) 25%,
            rgba(17,39,88,.42) 55%,
            rgba(8,18,54,.75) 80%,
            rgba(3,8,30,.92) 100%
        );

    transition:

        opacity
        2.2s
        ease;
}


#game.space-prep #spaceTransition{

    opacity:1;
}



/* =====================================================
   КОСМОС
===================================================== */

#space{

    position:absolute;

    inset:0;

    z-index:8;

    pointer-events:none;

    opacity:0;

    transform:
        scale(1.035);

    transition:

        opacity
        3.2s
        ease,

        transform
        6s
        ease;
}


#spaceImage{

    position:absolute;

    inset:0;

    display:block;

    width:100%;

    height:100%;

    object-fit:
        cover;

    object-position:
        center center;
}


#game.space-mode #space{

    opacity:1;

    transform:
        scale(1);
}



/* =====================================================
   ЗВЁЗДЫ
===================================================== */

#stars{

    position:absolute;

    inset:0;

    z-index:12;

    pointer-events:none;

    opacity:0;

    transition:

        opacity
        2.5s
        ease;
}


#game.space-mode #stars{

    opacity:1;
}


.star{

    position:absolute;

    border-radius:
        50%;

    background:
        white;

    box-shadow:

        0 0 5px
        rgba(255,255,255,.9),

        0 0 10px
        rgba(160,205,255,.7);

    animation:

        twinkle
        1.8s
        ease-in-out
        infinite
        alternate;
}


.star.big{

    box-shadow:

        0 0 6px white,

        0 0 14px
        rgba(150,200,255,.9),

        0 0 24px
        rgba(120,170,255,.55);
}


@keyframes twinkle{

    0%{

        opacity:.18;

        transform:
            scale(.65);
    }

    50%{

        opacity:1;

        transform:
            scale(1.2);
    }

    100%{

        opacity:.42;

        transform:
            scale(.82);
    }
}



/* =====================================================
   ФИНАЛ
===================================================== */

#finishText{

    position:absolute;

    left:50%;

    top:10%;

    transform:

        translate(-50%,-20px)

        scale(.9);

    z-index:60;

    opacity:0;

    color:white;

    text-align:center;

    white-space:
        nowrap;

    font-size:

        clamp(
            35px,
            4.5vw,
            65px
        );

    font-weight:
        400;

    text-shadow:

        0 4px 14px
        rgba(0,0,0,.5);

    transition:

        opacity .8s ease,
        transform .8s ease;
}


#finishText.show{

    opacity:1;

    transform:

        translate(-50%,0)

        scale(1);
}



/* =====================================================
   КНОПКА ВЕРНУТЬСЯ
===================================================== */

#backButton{

    position:absolute;

    left:50%;

    bottom:10%;

    transform:

        translateX(-50%)

        translateY(20px);

    z-index:70;

    padding:
        17px 30px;

    border:

        3px solid
        rgba(255,255,255,.9);

    border-radius:
        30px;

    background:
        rgba(255,255,255,.92);

    color:
        #214d78;

    font-size:

        clamp(
            23px,
            2.3vw,
            34px
        );

    font-weight:
        400;

    cursor:pointer;

    opacity:0;

    pointer-events:none;

    box-shadow:

        0 8px 22px
        rgba(0,0,0,.25);

    outline:none;

    white-space:
        nowrap;

    transition:

        opacity .7s ease,
        transform .7s ease;
}


#backButton.show{

    opacity:1;

    pointer-events:auto;

    transform:

        translateX(-50%)

        translateY(0);
}



/* =====================================================
   МОБИЛЬНАЯ ВЕРСИЯ
===================================================== */

@media (max-width:700px){


    #menuTitle{

        font-size:
            26px;

        padding:
            12px 20px;
    }


    .modeButton{

        min-width:
            230px;

        padding:
            18px 20px;

        font-size:
            25px;
    }


    #startMode{

        left:5%;

        top:27%;
    }


    #middleMode{

        right:5%;

        top:48%;
    }


    #endMode{

        left:5%;

        top:69%;
    }


    #rocket{

        width:

            clamp(
                130px,
                28vw,
                175px
            );

        bottom:
            27.5%;
    }


    /*
       ОБЛАКА МЕНЬШЕ
       И НА МОБИЛЬНОМ
    */

    .cloud-wrapper{

        width:

            clamp(
                165px,
                29vw,
                220px
            );
    }


    #finishText{

        font-size:

            clamp(
                30px,
                7vw,
                48px
            );
    }


    #backButton{

        font-size:
            25px;
    }

}

</style>

</head>


<body>


<div id="game">


    <div id="sky"></div>

    <div id="transitionSky"></div>


    <div id="airport"></div>

    <div id="airportFade"></div>

    <div id="skyTexture"></div>



    <!-- =================================================
         МЕНЮ
    ================================================== -->

    <div id="menu">


        <div id="menuTitle">

            Выбери позицию звука Р

        </div>


        <button
            class="modeButton"
            id="startMode"
        >

            Р в начале слова

        </button>


        <button
            class="modeButton"
            id="middleMode"
        >

            Р в середине слова

        </button>


        <button
            class="modeButton"
            id="endMode"
        >

            Р в конце слова

        </button>


    </div>



    <!--
        Элемент нужен JavaScript,
        но визуально он скрыт.
    -->

    <div id="loading"></div>



    <!-- =================================================
         КОСМОС
    ================================================== -->

    <div id="spaceTransition"></div>


    <div id="space">


        <img
            id="spaceImage"
            src="6B6A25F9-18FE-4AE2-BDE9-7FEC48B003DE.png"
            alt=""
        >


    </div>


    <div id="stars"></div>



    <!-- =================================================
         СТАРТ
    ================================================== -->

    <div id="startText">

        🚀 Нажми на ракету!

    </div>



    <!-- =================================================
         РАКЕТА
    ================================================== -->

    <div id="rocket">


        <div id="fire">


            <img
                id="fireImage"
                src="fire1.png"
                alt=""
            >


        </div>


        <img
            id="rocketImage"
            src="reketa.png"
            alt="Ракета"
        >


    </div>



    <!-- =================================================
         ФИНАЛ
    ================================================== -->

    <div id="finishText">

        Мы в открытом космосе

    </div>


    <button id="backButton">

        ← Вернуться на космодром

    </button>


</div>



<script>


/* =====================================================
   GITHUB
===================================================== */

const GITHUB_OWNER =
    "propodgotovkaa-creator";


const GITHUB_REPO =
    "Raketa";


const GITHUB_BRANCH =
    "main";



/* =====================================================
   ПАПКИ
===================================================== */

const MODE_FOLDERS = {

    start:
        "R-start",

    middle:
        "R-middle",

    end:
        "R-end"

};



/* =====================================================
   ПОЛОЖЕНИЯ ОБЛАКОВ
===================================================== */

const cloudSides = [

    "left",

    "right",

    "center",

    "left",

    "center",

    "right",

    "left",

    "right",

    "center",

    "left"

];



/* =====================================================
   ОГОНЬ
===================================================== */

const fireFrames = [

    "fire1.png",

    "fire2.png",

    "fire3.png",

    "fire4.png",

    "fire5.png",

    "fire6.png"

];


let fireFrameIndex = 0;

let fireTimer = null;



/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const game =
    document.getElementById(
        "game"
    );


const menu =
    document.getElementById(
        "menu"
    );


const loading =
    document.getElementById(
        "loading"
    );


const startMode =
    document.getElementById(
        "startMode"
    );


const middleMode =
    document.getElementById(
        "middleMode"
    );


const endMode =
    document.getElementById(
        "endMode"
    );


const rocket =
    document.getElementById(
        "rocket"
    );


const fireImage =
    document.getElementById(
        "fireImage"
    );


const startText =
    document.getElementById(
        "startText"
    );


const finishText =
    document.getElementById(
        "finishText"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const stars =
    document.getElementById(
        "stars"
    );



/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let selectedMode =
    null;


let selectedFolder =
    null;


let roundImages =
    [];


let gameStarted =
    false;


let currentRound =
    0;


let currentCloud =
    null;


let canClickCloud =
    false;


let finishing =
    false;



/* =====================================================
   ПЕРЕМЕШИВАНИЕ
===================================================== */

function shuffleArray(array){


    const copy =
        [...array];


    for(

        let i =
            copy.length - 1;

        i > 0;

        i--

    ){


        const j =

            Math.floor(

                Math.random() *

                (i + 1)

            );


        [

            copy[i],

            copy[j]

        ] = [

            copy[j],

            copy[i]

        ];

    }


    return copy;
}



/* =====================================================
   ЗАГРУЗКА КАРТИНОК ИЗ ПАПКИ
===================================================== */

async function loadImagesFromFolder(folder){


    const apiURL =

        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${folder}?ref=${GITHUB_BRANCH}`;


    const response =

        await fetch(

            apiURL,

            {

                cache:
                    "no-store"

            }

        );


    if(
        !response.ok
    ){


        throw new Error(

            "Не удалось открыть папку " +

            folder

        );

    }


    const files =

        await response.json();


    const images =

        files


        .filter(

            file =>

                file.type ===
                "file"

        )


        .filter(

            file =>

                /\.(png|jpg|jpeg|webp)$/i

                .test(
                    file.name
                )

        )


        .map(

            file =>

                file.download_url

        );


    return shuffleArray(
        images
    );
}



/* =====================================================
   ЗВЁЗДЫ
===================================================== */

function createStars(){


    stars.innerHTML =
        "";


    const amount =
        50;


    for(

        let i = 0;

        i < amount;

        i++

    ){


        const star =

            document.createElement(
                "div"
            );


        star.className =
            "star";


        if(
            Math.random() >
            .82
        ){


            star.classList.add(
                "big"
            );

        }


        const size =

            Math.random() *
            3 +
            1.3;


        star.style.width =
            size +
            "px";


        star.style.height =
            size +
            "px";


        star.style.left =

            Math.random() *
            100 +
            "%";


        star.style.top =

            Math.random() *
            100 +
            "%";


        star.style.animationDuration =

            (

                Math.random() *
                2.4 +

                1.1

            ) +

            "s";


        star.style.animationDelay =

            (

                Math.random() *
                2.5

            ) +

            "s";


        stars.appendChild(
            star
        );

    }

}


createStars();



/* =====================================================
   ВЫБОР РЕЖИМА
===================================================== */

startMode.addEventListener(

    "click",

    () =>
        selectMode(
            "start"
        )

);


middleMode.addEventListener(

    "click",

    () =>
        selectMode(
            "middle"
        )

);


endMode.addEventListener(

    "click",

    () =>
        selectMode(
            "end"
        )

);



async function selectMode(mode){


    menu.style.pointerEvents =
        "none";


    selectedMode =
        mode;


    selectedFolder =

        MODE_FOLDERS[
            mode
        ];


    try{


        /*
           Загружаем картинки
           в фоне.
        */

        roundImages =

            await loadImagesFromFolder(

                selectedFolder

            );


        if(
            roundImages.length ===
            0
        ){


            throw new Error(

                "В папке нет картинок."

            );

        }


        roundImages =

            roundImages.slice(
                0,
                10
            );


        /*
           Никакой надписи
           о загрузке нет.
        */


        menu.classList.add(
            "hidden"
        );


        setTimeout(

            () => {


                rocket.classList.add(
                    "ready"
                );


                startText.classList.remove(
                    "hidden"
                );


                startText.classList.add(
                    "visible"
                );


            },

            450

        );


    }

    catch(error){


        console.error(
            error
        );


        /*
           Если вдруг произошла ошибка,
           просто возвращаем возможность
           выбрать режим снова.
        */

        menu.style.pointerEvents =
            "auto";

    }

}



/* =====================================================
   ОГОНЬ
===================================================== */

function startFireAnimation(){


    if(
        fireTimer
    ){

        return;

    }


    game.classList.add(
        "engine-on"
    );


    fireFrameIndex =
        0;


    fireImage.src =
        fireFrames[0];


    fireTimer =

        setInterval(

            () => {


                fireFrameIndex++;


                if(

                    fireFrameIndex >=

                    fireFrames.length

                ){


                    fireFrameIndex =
                        0;

                }


                fireImage.src =

                    fireFrames[
                        fireFrameIndex
                    ];


            },

            95

        );

}



/* =====================================================
   СТАРТ ИГРЫ
===================================================== */

rocket.addEventListener(

    "click",

    startGame

);


function startGame(){


    if(

        gameStarted ||

        roundImages.length ===
        0

    ){

        return;

    }


    gameStarted =
        true;


    startText.classList.add(
        "hidden"
    );


    startText.classList.remove(
        "visible"
    );


    startFireAnimation();


    setTimeout(

        () => {


            game.classList.add(
                "flying"
            );


            rocket.style.bottom =
                "41%";


        },

        500

    );


    setTimeout(

        () => {


            rocket.style.bottom =
                "28%";


            createRound();


        },

        3500

    );

}



/* =====================================================
   СОЗДАНИЕ ОБЛАКА
===================================================== */

function createRound(){


    if(

        currentRound >=

        roundImages.length

    ){


        startSpaceSequence();


        return;

    }


    canClickCloud =
        true;


    const side =

        cloudSides[

            currentRound %

            cloudSides.length

        ];


    const wrapper =

        document.createElement(
            "div"
        );


    wrapper.className =

        `cloud-wrapper ${side}`;


    wrapper.setAttribute(

        "tabindex",

        "-1"

    );


    const image =

        document.createElement(
            "img"
        );


    image.src =

        roundImages[
            currentRound
        ];


    image.alt =
        "";


    image.setAttribute(

        "draggable",

        "false"

    );


    wrapper.appendChild(
        image
    );


    game.appendChild(
        wrapper
    );


    currentCloud =
        wrapper;



    /*
       POINTERDOWN:
       реагируем сразу
       при касании.
    */

    wrapper.addEventListener(

        "pointerdown",

        event => {


            event.preventDefault();


            chooseCloud(

                wrapper,

                side

            );

        },

        {

            passive:false

        }

    );



    /*
       Если ребёнок не нажал,
       тот же раунд появляется снова.
    */

    wrapper.addEventListener(

        "animationend",

        () => {


            if(

                wrapper ===
                currentCloud

                &&

                !wrapper.classList.contains(
                    "correct"
                )

            ){


                wrapper.remove();


                currentCloud =
                    null;


                setTimeout(

                    createRound,

                    350

                );

            }

        }

    );

}



/* =====================================================
   НАЖАЛИ НА ОБЛАКО
===================================================== */

function chooseCloud(
    cloud,
    side
){


    if(

        !canClickCloud ||

        finishing

    ){

        return;

    }


    canClickCloud =
        false;


    /*
       Никакой тени
       или подсветки.
    */

    cloud.style.outline =
        "none";


    cloud.style.boxShadow =
        "none";


    cloud.style.filter =
        "none";


    cloud.style.background =
        "transparent";


    /*
       Облако исчезает.
    */

    cloud.classList.add(
        "correct"
    );


    /*
       Ракета меняет траекторию.
    */

    moveRocketTo(
        side
    );


    /*
       Полностью удаляем облако.
    */

    setTimeout(

        () => {


            cloud.remove();


            currentCloud =
                null;


        },

        130

    );


    currentRound++;


    /*
       Следующий раунд.
    */

    setTimeout(

        createRound,

        1200

    );

}



/* =====================================================
   ТРАЕКТОРИЯ РАКЕТЫ
===================================================== */

function moveRocketTo(side){


    if(
        side ===
        "left"
    ){


        rocket.style.left =
            "24%";


        rocket.style.transform =

            "translateX(-50%) rotate(-7deg)";

    }


    if(
        side ===
        "center"
    ){


        rocket.style.left =
            "50%";


        rocket.style.transform =

            "translateX(-50%) rotate(0deg)";

    }


    if(
        side ===
        "right"
    ){


        rocket.style.left =
            "76%";


        rocket.style.transform =

            "translateX(-50%) rotate(7deg)";

    }


    setTimeout(

        () => {


            rocket.style.transform =

                "translateX(-50%) rotate(0deg)";


        },

        850

    );

}



/* =====================================================
   ПЕРЕХОД В ОТКРЫТЫЙ КОСМОС
===================================================== */

function startSpaceSequence(){


    if(
        finishing
    ){

        return;

    }


    finishing =
        true;


    /*
       Ракета возвращается
       к центру.
    */

    rocket.style.left =
        "50%";


    rocket.style.transform =

        "translateX(-50%) rotate(0deg)";


    rocket.style.bottom =
        "40%";


    /*
       Начинается затемнение.
    */

    game.classList.add(
        "space-prep"
    );


    /*
       Проявляется космос.
    */

    setTimeout(

        () => {


            game.classList.add(
                "space-mode"
            );


        },

        1100

    );


    /*
       Ракета поднимается выше.
    */

    setTimeout(

        () => {


            rocket.style.bottom =
                "48%";


        },

        2700

    );


    /*
       Финальная фраза.
    */

    setTimeout(

        () => {


            finishText.classList.add(
                "show"
            );


        },

        4200

    );


    /*
       Ракета улетает.
    */

    setTimeout(

        () => {


            rocket.style.transition =

                "bottom 3.6s ease-in, " +

                "left 1.2s ease, " +

                "transform .7s ease";


            rocket.style.bottom =
                "118%";


        },

        5900

    );


    /*
       Кнопка возврата
       на космодром.
    */

    setTimeout(

        () => {


            backButton.classList.add(
                "show"
            );


        },

        7600

    );

}



/* =====================================================
   ВЕРНУТЬСЯ НА КОСМОДРОМ
===================================================== */

backButton.addEventListener(

    "click",

    resetGame

);


function resetGame(){


    /*
       Удаляем облака.
    */

    document

        .querySelectorAll(
            ".cloud-wrapper"
        )

        .forEach(

            cloud =>

                cloud.remove()

        );


    /*
       Останавливаем огонь.
    */

    if(
        fireTimer
    ){


        clearInterval(
            fireTimer
        );


        fireTimer =
            null;

    }


    /*
       Сбрасываем игру.
    */

    selectedMode =
        null;


    selectedFolder =
        null;


    roundImages =
        [];


    gameStarted =
        false;


    currentRound =
        0;


    currentCloud =
        null;


    canClickCloud =
        false;


    finishing =
        false;


    game.classList.remove(

        "engine-on",

        "flying",

        "space-prep",

        "space-mode"

    );


    /*
       Возвращаем ракету
       на космодром,
       но скрываем до выбора режима.
    */

    rocket.classList.remove(
        "ready"
    );


    rocket.style.animation =
        "";


    rocket.style.transition =

        "opacity .55s ease, " +

        "left 1.15s cubic-bezier(.22,.75,.3,1), " +

        "bottom 2.8s cubic-bezier(.22,.75,.3,1), " +

        "transform .55s ease";


    rocket.style.left =
        "50%";


    rocket.style.bottom =
        "27.5%";


    rocket.style.transform =

        "translateX(-50%) rotate(0deg)";


    /*
       Скрываем тексты.
    */

    startText.classList.remove(
        "visible"
    );


    startText.classList.add(
        "hidden"
    );


    finishText.classList.remove(
        "show"
    );


    backButton.classList.remove(
        "show"
    );


    /*
       Меню снова активно.
    */

    menu.style.pointerEvents =
        "auto";


    /*
       Возвращаем выбор режима.
    */

    setTimeout(

        () => {


            menu.classList.remove(
                "hidden"
            );


        },

        400

    );

}


</script>
